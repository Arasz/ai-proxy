# Path-based PR labeling for the Labeler workflow (.github/workflows/labeler.yml).
# actions/labeler v7 config syntax: https://github.com/actions/labeler#usage

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CLAUDE.md"
          - "LICENSE"

core:
  - changed-files:
      - any-glob-to-any-file:
          - "src/AiProxy.Core/**"

proxy:
  - changed-files:
      - any-glob-to-any-file:
          - "src/AiProxy/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"

.NET:
  - changed-files:
      - any-glob-to-any-file:
          - "Directory.Packages.props"
          - "Directory.Build.props"
          - "*.slnx"
          - "global.json"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
