name: build

# No `paths:`/`paths-ignore:` filter on `pull_request:` below — on purpose.
#
# build-fast, build-slow and build-bdd are required status checks (see the
# repository ruleset). If this workflow were trigger-filtered to skip doc-only
# PRs, those checks would simply never report on such a PR, and branch
# protection would block it forever waiting for a check that will never arrive.
# That is not hypothetical: a trigger-filtered variant of this workflow left a
# docs-only PR with none of the three required checks in its status rollup, and
# it merged only because the merging account had ruleset bypass. Anyone
# without bypass would have been stuck.
#
# Instead, the workflow always triggers and each heavy job always runs (see
# `changes` below): a cheap diff classifies the PR, and build-fast/build-bdd/
# build-slow skip their expensive steps — but the *job* itself still executes
# and still reports success, which is what branch protection needs to see.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

permissions:
  contents: read

# Superseded PR pushes cancel their in-flight run; main pushes never cancel, so
# every main run stays a complete record.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Single source of truth for "does this diff affect build/test outcome".
    # build-fast/build-bdd/build-slow each read this job's `code` output and
    # skip their expensive steps when it is 'false' — see the note on
    # `pull_request:` above for why this lives in a job instead of a trigger
    # filter.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Lists the paths that may skip the build: dated records, release notes,
          # prose guides and agent instructions. Everything else is code, so a path
          # nobody listed (global.json, Directory.Build.targets, a script the test
          # project references) runs the tests instead of skipping them.
          # docs/adr, docs/reference and docs/how-to are the specification and run
          # the build. VERSION is code: release.yml triggers on it.
          SKIP_REGEX='^docs/(work|changelog|tutorials|explanation|notes)/|^[^/]+\.md$|^\.ai-badger/|^\.claude/|^LICENSE$'

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit (new branch or force-push); treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          # Code when any changed file is outside the skip list.
          if echo "$CHANGED" | grep -qvE "$SKIP_REGEX"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/dumps/coredump.%p.dmp
      # A crashed build/test step must not leave MSBuild node-reuse processes
      # spinning on the runner for the rest of the run.
      MSBUILDDISABLENODEREUSE: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: true
    steps:
      - name: Skip (doc-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changed; skipping the build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          global-json-file: global.json
      - name: Build
        if: needs.changes.outputs.code == 'true'
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301.
        #
        # No -p:RuntimeIdentifiers override: the csproj already declares the six
        # shipped RIDs, and MSBuild reads a `;` in a -p: value as a separate
        # switch (MSB1006, "Property is not valid"). Passing the list here
        # broke the build; declaring it in the project is the fix.
        run: mkdir -p .nupkg-local && dotnet build --configuration Release --nologo
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: dotnet test --configuration Release --no-build --nologo

  build-slow:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/dumps/coredump.%p.dmp
      MSBUILDDISABLENODEREUSE: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: true
    steps:
      - name: Skip (doc-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changed; skipping the build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          global-json-file: global.json
      - name: Build for every shipped runtime identifier
        if: needs.changes.outputs.code == 'true'
        # nuget.config references the gitignored local feed .nupkg-local/; make it
        # exist on the fresh runner or restore fails with NU1301.
        #
        # The six RIDs come from the csproj's own RuntimeIdentifiers. This step
        # differs from build-fast by building them all, which is what a pack
        # for every runtime identifier needs. A -p:RuntimeIdentifiers override
        # is deliberately absent: MSBuild reads the `;` in such a value as a
        # separate switch and fails with MSB1006.
        run: mkdir -p .nupkg-local && dotnet build --configuration Release --nologo
      - name: Pack every runtime identifier
        if: needs.changes.outputs.code == 'true'
        # The release lane publishes one payload package per runtime identifier,
        # so a package that cannot be packed for a shipped RID is a broken
        # release. This lane is where that shows up, before the release is cut.
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64 linux-musl-x64; do
            echo "==> packing $rid"
            dotnet pack src/AiProxy/AiProxy.csproj -c Release \
              -p:RuntimeIdentifiers=$rid -o "artifacts/$rid" --nologo
          done
      - name: Patch the tool shell to reference every RID
        if: needs.changes.outputs.code == 'true'
        # The SDK writes only the packed RID into the shell's DotnetToolSettings.xml;
        # a multi-RID tool shell must list every payload package or `dotnet tool
        # install` rejects all other platforms. The script is self-gating: it fails
        # the step unless the patched settings list every RID exactly once.
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VER" ]; then echo "::error::VERSION at the repo root is empty or missing." >&2; exit 1; fi
          python3 scripts/patch-tool-shell.py "artifacts/osx-arm64/ai-proxy.$VER.nupkg" win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64 linux-musl-x64
      - name: Upload the packed runtime identifiers
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-all-rids
          path: artifacts/
          if-no-files-found: ignore
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: dotnet test --configuration Release --no-build --nologo

  build-bdd:
    # The documentation and release-contract lane. It keeps its name because it
    # is a required check, and it runs on every change, docs-only included,
    # because docs-only changes are what it checks: every docs index resolves,
    # every evidence anchor names a real line, every action is pinned to a SHA,
    # and the current VERSION has its changelog entry.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Docs index
        run: python3 scripts/check-docs-index.py
      - name: Evidence anchors
        run: python3 scripts/check-evidence-anchors.py
      - name: Actions pinned to a commit SHA
        run: |
          set -euo pipefail
          bad="$(grep -rhoE 'uses: [^@[:space:]]+@[^[:space:]]+' .github/workflows/ | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$bad" ]; then echo "unpinned action reference(s):"; echo "$bad"; exit 1; fi
      - name: Changelog entry for VERSION
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          ls docs/changelog/"${version}"-*.md >/dev/null 2>&1 || { echo "docs/changelog/${version}-*.md is missing"; exit 1; }
